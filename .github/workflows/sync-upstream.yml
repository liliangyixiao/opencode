name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'  # 每天自动同步一次
  workflow_dispatch:      # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/原作者/原仓库.git
          git fetch upstream
          git merge upstream/main --no-edit
          git push origin main
